<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Nodos explorados por instancia y configuracion</title>
<desc id="descripcion">Treinta y cinco corridas reales con limite de 5000 nodos. El eje horizontal usa log10 de uno mas el numero de nodos. Los contornos discontinuos identifican corridas que alcanzaron el limite.</desc>
<rect width="1200" height="1320" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033} .small{font-size:13px}.label{font-size:14px}.group{font-size:19px;font-weight:bold}.grid{stroke:#d6dce5;stroke-width:1}</style>
<text x="32" y="42" font-size="27" font-weight="bold">Busqueda de horarios: modo interpretado</text>
<text x="32" y="70" class="label">Nodos explorados; limite comun de 5000 por corrida; escala log10(1 + nodos).</text>
<text x="32" y="93" class="small">BT ingenuo sin simetria. Las otras configuraciones activan simetria. CLPFD opt exige costo minimo.</text>
